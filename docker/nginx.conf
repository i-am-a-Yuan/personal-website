# Nginx 配置 - 服务前端静态文件并代理后端 API

server {
    listen 3718;
    server_name localhost;

    # 前端静态文件根目录
    root /var/www/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # 后端 API 代理（放在 /my-site/ 前面，优先匹配）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # H2 数据库控制台 (生产环境建议关闭)
    location /h2-console/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端 - /my-site/ 子路径部署
    location /my-site/ {
        # 使用 alias 指向实际的静态文件目录
        alias /var/www/html/;
        try_files $uri $uri/ /my-site/index.html;
    }

    # 根路径重定向到 /my-site/
    location = / {
        return 301 /my-site/;
    }

    # 静态资源缓存（匹配 /my-site/ 下的静态资源）
    location ~* ^/my-site/(.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot))$ {
        alias /var/www/html/$1;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
